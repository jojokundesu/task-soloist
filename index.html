<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <title>Task Soloist</title>
    <meta name="description" content="Level up your life through daily achievements - fully offline Solo Leveling inspired task manager" />
    <meta name="author" content="Task Soloist" />
    <meta name="theme-color" content="#121318" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon.ico" />
    <style>
      /* Self-hosted fallback font stack — no external CDN required */
      html, body {
        font-family: "Segoe UI", "Helvetica Neue", Arial, system-ui, sans-serif;
        background: #121318;
        color: #f2f2f2;
        margin: 0;
      }
      #boot-splash {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: #121318; z-index: 9999; flex-direction: column; gap: 12px;
      }
      #boot-splash .spinner {
        width: 40px; height: 40px; border: 4px solid #8B5CF6; border-top-color: transparent;
        border-radius: 50%; animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>

  <body>
    <div id="boot-splash">
      <div class="spinner"></div>
      <div style="color:#a78bfa;font-size:14px;">Awakening the System...</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Remove splash once React mounts
      window.addEventListener('DOMContentLoaded', function () {
        setTimeout(function () {
          var s = document.getElementById('boot-splash');
          if (s) s.style.display = 'none';
        }, 400);
      });
    </script>
    <noscript>
      <div style="text-align: center; padding: 20px;">
        JavaScript is required to run Task Soloist. Please enable JavaScript to continue.
      </div>
    </noscript>
  </body>
</html>
